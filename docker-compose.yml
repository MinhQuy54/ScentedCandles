version: '3.8'

services:
  # --- INFRASTRUCTURE SERVICES ---
  postgres:
    image: postgres:16-alpine
    container_name: scented-candles-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scented-candles-redis
    restart: always
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: scented-candles-qdrant
    restart: always
    ports:
      - '${QDRANT_REST_PORT}:6333'
      - '${QDRANT_GRPC_PORT}:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  # --- APPLICATION SERVICES ---
  ai-chatbot:
    build:
      context: ./app/ai-engine
      dockerfile: src/chatbot/Dockerfile
    container_name: scented-candles-ai-chatbot
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./app/ai-engine/.env
    depends_on:
      - postgres
      - qdrant

  api-gateway:
    build:
      context: ./app/api-gateway
      dockerfile: Dockerfile
    container_name: scented-candles-api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis
      - AI_CHATBOT_URL=http://ai-chatbot:8000
    depends_on:
      - postgres
      - redis
      - ai-chatbot

  web-fe:
    build:
      context: ./app/web-fe
      dockerfile: Dockerfile
    container_name: scented-candles-web-fe
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
version: '3.8'

services:
  # --- INFRASTRUCTURE SERVICES ---
  postgres:
    image: postgres:16-alpine
    container_name: scented-candles-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scented-candles-redis
    restart: always
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: scented-candles-qdrant
    restart: always
    ports:
      - '${QDRANT_REST_PORT}:6333'
      - '${QDRANT_GRPC_PORT}:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: scented-candles-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - '${ELASTICSEARCH_PORT}:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # --- APPLICATION SERVICES ---
  ai-engine:
    build:
      context: ./app/ai-engine
      dockerfile: Dockerfile
    container_name: scented-candles-ai-engine
    restart: always
    ports:
      - "50051:50051"
    environment:
      - QDRANT_HOST=qdrant
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - qdrant
      - elasticsearch

  api-gateway:
    build:
      context: ./app/api-gateway
      dockerfile: Dockerfile
    container_name: scented-candles-api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis
      - AI_SERVICE_GRPC_URL=ai-engine:50051
    depends_on:
      - postgres
      - redis
      - ai-engine

  web-fe:
    build:
      context: ./app/web-fe
      dockerfile: Dockerfile
    container_name: scented-candles-web-fe
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  es_data:
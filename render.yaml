services:
  # 1. API Gateway (NestJS Backend)
  - type: web
    name: scented-candles-api-gateway
    runtime: docker
    rootDir: app/api-gateway
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scented-candles-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: scented-candles-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: scented-candles-redis
          property: port
      - key: AI_SERVICE_GRPC_URL
        fromService:
          type: web
          name: scented-candles-ai-engine
          property: hostport
      - key: PORT
        value: "3000"
      - key: FRONTEND_URL
        value: "https://aurascent-eight.vercel.app"
      - key: PUBLIC_BASE_URL
        value: "https://scented-candles-api-gateway.onrender.com"
      - key: AI_CHATBOT_URL
        value: "https://scented-candles-ai-chatbot.onrender.com"
      - key: AI_ENGINE_URL
        value: "https://scented-candles-ai-chatbot.onrender.com"
      - key: JWT_SECRET
        generateValue: true

  # 2. AI Engine (Python gRPC Service - Web Service for Free Plan)
  - type: web
    name: scented-candles-ai-engine
    runtime: docker
    rootDir: app/ai-engine
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: scented-candles-redis
          property: connectionString

  # 3. Redis Cache / Message Broker
  - type: redis
    name: scented-candles-redis
    plan: free
    ipAllowList: []

  # 4. AI Chatbot (FastAPI Streaming Service)
  - type: web
    name: scented-candles-ai-chatbot
    runtime: docker
    rootDir: app/ai-engine
    dockerfilePath: src/chatbot/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: FRONTEND_URL
        value: "https://aurascent-eight.vercel.app"
      - key: QDRANT_COLLECTION_NAME
        value: "aurascent_products"
      - key: DATABASE_URL
        fromDatabase:
          name: scented-candles-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: scented-candles-redis
          property: connectionString
      - key: API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # 5. Celery Worker (Background Worker Service for Qdrant Sync)
  - type: worker
    name: scented-candles-celery-worker
    runtime: docker
    rootDir: app/ai-engine
    dockerfilePath: src/chatbot/Dockerfile.celery
    plan: free
    envVars:
      - key: QDRANT_COLLECTION_NAME
        value: "aurascent_products"
      - key: DATABASE_URL
        fromDatabase:
          name: scented-candles-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: scented-candles-redis
          property: connectionString
      - key: API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

databases:
  # 6. PostgreSQL Database
  - name: scented-candles-postgres
    databaseName: scented_candles
    user: scented_user
    plan: free

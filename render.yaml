services:
  # 1. API Gateway (NestJS Backend)
  - type: web
    name: scented-candles-api-gateway
    runtime: docker
    rootDir: app/api-gateway
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        value: "postgresql://276v5yh5oi9u8y9a.postgres:ijP3mrb9VRRqEu1Kemnx5dOtwOIrQXaD@276v5yh5oi9u8y9a.gateway01.us-east-1.prod.aws.pg.tidbcloud.com:5432/postgres?sslmode=require"
      - key: REDIS_HOST
        fromService:
          type: redis
          name: scented-candles-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: scented-candles-redis
          property: port
      - key: PORT
        value: "3000"
      - key: FRONTEND_URL
        value: "https://aurascent-eight.vercel.app"
      - key: CORS_ORIGINS
        value: "https://aurascent-eight.vercel.app,http://localhost:5173"
      - key: PUBLIC_BASE_URL
        value: "https://scented-candles-api-gateway.onrender.com"
      - key: AI_CHATBOT_URL
        value: "https://scented-candles-ai-chatbot.onrender.com"
      - key: AI_ENGINE_URL
        value: "https://scented-candles-ai-chatbot.onrender.com"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      - key: VIETQR_BANK_ID
        value: "MB"
      - key: VIETQR_ACCOUNT_NO
        value: "0325367066"
      - key: VIETQR_ACCOUNT_NAME
        value: "NGO MINH QUY"

  # 2. AI Chatbot + Celery Worker (FastAPI Streaming + Celery Worker Combo Container)
  - type: web
    name: scented-candles-ai-chatbot
    runtime: docker
    rootDir: app/ai-engine
    dockerfilePath: src/chatbot/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: FRONTEND_URL
        value: "https://aurascent-eight.vercel.app"
      - key: QDRANT_COLLECTION_NAME
        value: "aurascent_products"
      - key: DATABASE_URL
        value: "postgresql://276v5yh5oi9u8y9a.postgres:ijP3mrb9VRRqEu1Kemnx5dOtwOIrQXaD@276v5yh5oi9u8y9a.gateway01.us-east-1.prod.aws.pg.tidbcloud.com:5432/postgres?sslmode=require"
      - key: REDIS_URL
        fromService:
          type: redis
          name: scented-candles-redis
          property: connectionString
      - key: API_KEY
        value: "AIzaSyDkXXPQhSs0C9Xd9QUW4lxfG9Ryb1hlJUg"
      - key: QDRANT_URL
        value: "https://bc1b2c44-7843-47c6-bde9-4faf0cbc4f69.us-west-2-0.aws.cloud.qdrant.io"
      - key: QDRANT_API_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6ZjkzODk3ZTktOWVkZC00YTkxLTg2MWYtOWVhYWRlNWU2NmIxIn0.Jh5YQeFwFnEUKg2h77UBTz9ICbRXXKqxIhfLbTbitds"

  # 3. Redis Cache / Message Broker

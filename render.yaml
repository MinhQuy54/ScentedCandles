services:
  # 1. API Gateway (NestJS Backend)
  - type: web
    name: scented-candles-api-gateway
    runtime: docker
    rootDir: app/api-gateway
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scented-candles-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: scented-candles-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: scented-candles-redis
          property: port
      - key: AI_SERVICE_GRPC_URL
        fromService:
          type: pserv
          name: scented-candles-ai-engine
          property: hostport
      - key: PORT
        value: "3000"

  # 2. AI Engine (Python gRPC Service - Private Service)
  - type: pserv
    name: scented-candles-ai-engine
    runtime: docker
    rootDir: app/ai-engine
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: scented-candles-redis
          property: connectionString

  # 3. Web Frontend (React + Vite)
  - type: web
    name: scented-candles-web-fe
    runtime: docker
    rootDir: app/web-fe
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: scented-candles-api-gateway
          property: url

  # 4. Redis Cache / Message Broker
  - type: redis
    name: scented-candles-redis
    plan: free
    ipAllowList: []

databases:
  # 5. PostgreSQL Database
  - name: scented-candles-postgres
    databaseName: scented_candles
    user: scented_user
    plan: free

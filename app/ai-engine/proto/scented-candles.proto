syntax = "proto3";

package scented_candles.ai.v1;

// Service xử lý toàn bộ logic AI & Search nội bộ
service ScentedCandlesAIService {
  // 1. Hybrid Search (Unary RPC): Kết hợp Full-text (Elasticsearch) + Vector (Qdrant) bằng thuật toán RRF
  rpc SmartSearch (SearchQuery) returns (SearchResponse);

  // 2. Metadata Extraction (Unary RPC): Bóc tách thuộc tính nến thơm (Top/Middle/Base Notes, Moods) khi Admin tạo sản phẩm
  rpc ExtractCandleMetadata (ExtractRequest) returns (ExtractResponse);
}

message SearchQuery {
  string query = 1;      // VD: "nến thơm mùi gỗ ấm cho phòng ngủ buổi tối"
  int32 limit = 2;      // Số lượng sản phẩm tối đa trả về
}

message CandleProduct {
  string id = 1;
  string name = 2;
  double price = 3;
  string image_url = 4;
  float similarity_score = 5; // Điểm khớp ngữ nghĩa (Score)
}

message SearchResponse {
  repeated CandleProduct products = 1;
}

message ExtractRequest {
  string raw_description = 1;
}

message ExtractResponse {
  repeated string top_notes = 1;    // Hương đầu (VD: ["Chanh", "Cam"])
  repeated string middle_notes = 2; // Hương giữa (VD: ["Oải hương"])
  repeated string base_notes = 3;   // Hương cuối (VD: ["Gỗ thông", "Hổ phách"])
  repeated string moods = 4;        // Không gian / Cảm xúc (VD: ["Thư giãn", "Phòng ngủ"])
}
